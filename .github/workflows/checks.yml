name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q cli.py replay.py verify.py verifiable_memory tests
      - name: Baseline checks
        run: python tests/checks.py
      - name: Checkpoint and audit regressions
        run: python tests/regressions.py
      - name: LLM protocols and CLI regressions (local HTTP fixtures)
        run: python tests/llm_checks.py
      - name: Directed vector entity and inference checks
        run: python tests/vector_checks.py
      - name: Frozen demo
        run: python cli.py script
      - name: Replay demo
        run: python replay.py
      - name: Independently verify demo
        run: python verify.py
